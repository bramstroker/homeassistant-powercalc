[project]
name = "Powercalc"
version = "0.1.0"
description = "Custom Home Assistant component for virtual power sensors"
maintainers = [
  { name = "Bram Gerritsen", email = "bgerritsen@gmail.com" },
]
keywords = [
  "homeassistant",
  "energy",
  "power",
  "custom-component",
  "custom-integration",
]
classifiers = [
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14.2,<4.0"
dependencies = ["homeassistant"]
license = "MIT"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "utils/library/tests",
]
norecursedirs = ".git"
asyncio_mode = "auto"
markers = [
    "skip_remote_loader_mocking: Do not mock globally registered remote loader mock",
]
log_level = "DEBUG"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "powercalc"]
known-third-party = ["homeassistant"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ty.environment]
# The release-draft entry points run as plain scripts and import their siblings flat.
extra-paths = [".github/scripts/release_draft"]

[tool.ty.src]
# Test suites are exercised by pytest, not by the type checker.
exclude = ["**/tests/"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "homeassistant.components.**",
]

[tool.mypy]
python_version = "3.14"
show_error_codes = true
follow_imports = "silent"
strict = true
# Not covered by `strict`
local_partial_types = true
warn_incomplete_stub = true
warn_unused_configs = true
warn_unreachable = true
# The release-draft entry points are executed as plain scripts, so their sibling
# modules are imported flat. Put that directory on the search path and make mypy
# derive module names from an explicit base instead of walking up to __init__.py.
mypy_path = ".github/scripts/release_draft"
explicit_package_bases = true
# Test suites are exercised by pytest, not by the type checker.
exclude = ["/tests/"]

[[tool.mypy.overrides]]
module = "homeassistant.components.*"
ignore_missing_imports = true

[tool.coverage.paths]
source = ["custom_components/powercalc", "utils", "tests"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["utils/measure/playground", "docs"]

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "B", "BLE", "C", "C4", "COM", "E", "F", "FAST", "FIX", "FLY", "FURB", "G", "ICN", "I", "INP", "ISC", "LOG", "N", "NPY", "PERF", "PIE", "PLE", "PT", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TID", "UP", "W", "YTT"]
# COM812 is enforced by the formatter itself; keeping it selected only causes
# the formatter-conflict warning. COM818 (bare tuple) stays enabled.
ignore = ["S101", "COM812"]

[tool.ruff.lint.per-file-ignores]
".github/scripts/**.py" = ["T201"]
"utils/library/update_library.py" = ["T201"]
"utils/measure/**.py" = ["T201"]
"tests/**.py" = ["ASYNC230"]

[tool.ruff.lint.flake8-pytest-style]
# The test suite consistently declares parametrize names as a single csv string
# ("a,b,c") rather than a tuple, so match that instead of ruff's tuple default.
parametrize-names-type = "csv"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv]
prerelease = "allow"
override-dependencies = [
  "mashumaro[msgpack]==3.17",
  "habluetooth>=6.8.1",
]

[dependency-groups]
docs = [
    "zensical>=0.0.5",
]
library = [
    "jsonschema>=4.0",
    "pytablewriter==1.2.1",
]
profile-library = [
    "aiofiles>=25.1.0",
    "gitpython>=3.1.57",
    "httpx>=0.28.1",
]
dev = [
    "prek",
    "ruff>=0.15.0",
    "mypy==2.3.0",
    "voluptuous-stubs>=0.1",
    "homeassistant-stubs",
    "pytest-homeassistant-custom-component==0.13.355",
    "types-pytz>=2024.1",
    "types-croniter>=2.0",
    "croniter>=6.0.0",
    "aioresponses>=0.7.6",
    "pyturbojpeg>=1.8.2",
    "ty>=0.0.39",
    "types-jsonschema>=4.26.0.20260518",
    "types-aiofiles>=25.1.0.20260518",
]

[tool.setuptools]
packages = ["custom_components"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.codespell]
ignore-words-list = 'hass'
check-filenames = true
skip = '*/translations/*.json,*/package-lock.json,*/model.json,*/library.json,uv.lock'
