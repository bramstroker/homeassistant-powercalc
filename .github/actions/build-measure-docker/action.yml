name: Build measure Docker image
description: Build the measure utility Docker image for the supported platforms.

inputs:
  push:
    description: Whether to push the built image.
    required: false
    default: "false"
  tags:
    description: Docker image tags to apply.
    required: false
    default: ""
  labels:
    description: Docker image labels to apply.
    required: false
    default: ""
  target:
    description: Dockerfile target to build (runtime or ha-app).
    required: false
    default: "runtime"
  platforms:
    description: Comma-separated target platforms.
    required: false
    default: "linux/amd64,linux/arm64"

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ./utils/measure
        platforms: ${{ inputs.platforms }}
        target: ${{ inputs.target }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: type=gha,scope=measure-${{ inputs.target }}
        cache-to: type=gha,mode=max,scope=measure-${{ inputs.target }}
