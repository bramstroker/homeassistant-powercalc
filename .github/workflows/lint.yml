name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for the same pull request; every other event gets a
  # unique group so pushes, schedules and dispatches never cancel or queue each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: "true"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
        # The type checkers now cover utils/library and .github/scripts, so the
        # groups holding their third-party imports have to be installed too.
      - run: uv sync --locked --group library --group profile-library
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          cache: true
      - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
        if: always()
        with:
          msg: 'style: apply pre-commit auto-fixes'
