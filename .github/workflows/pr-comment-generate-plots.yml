name: Generate PR plots

on:
  pull_request:
    paths:
      - 'profile_library/**/*.csv.gz'
      - 'profile_library/**/model.json'

concurrency:
  # Supersede in-flight runs for the same pull request; every other event gets a
  # unique group so pushes, schedules and dispatches never cancel or queue each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-plots:
    name: Generate plots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted visualization code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout PR files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          working-directory: './base/utils/measure'
          enable-cache: true
          cache-dependency-glob: |
            base/utils/measure/pyproject.toml
            base/utils/measure/uv.lock
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        name: List changed files from the PR
        id: list-files
        with:
          script: |
            const fs = require('fs')
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            })
            const files = changed.map((entry) => entry.filename).filter((file) => {
              if (/^profile_library\/.+\/(brightness|color_temp|hs|effect)\.csv\.gz$/.test(file)) return true
              if (!/^profile_library\/.+\/model\.json$/.test(file) || !fs.existsSync(`pr/${file}`)) return false
              try {
                const model = JSON.parse(fs.readFileSync(`pr/${file}`, 'utf8'))
                if (model.calculation_strategy === 'linear') return Array.isArray(model.linear_config?.calibrate)
                return model.calculation_strategy === 'composite'
              } catch {
                return false
              }
            })
            core.setOutput('changedFiles', files.join('\n'))
            core.setOutput('hasPlots', files.length ? 'true' : 'false')
      - name: Run visualization tool
        if: steps.list-files.outputs.hasPlots == 'true'
        run: |
          mkdir -p plot-artifacts
          while IFS= read -r file; do
            if [ -z "${file}" ]; then
              continue
            fi
            echo "Generating plot for - ${file}."
            source="${{ github.workspace }}/pr/${file}"
            if [ -f "${source}" ]; then
              relative="${file#profile_library/}"
              if [[ "${relative}" == */model.json ]]; then
                strategy="$(jq -r '.calculation_strategy // empty' "${source}")"
                if [[ "${strategy}" == "composite" ]]; then
                  uv --project base/utils/measure run --group visualize powercalc-visualize \
                    "${source}" --kind=composite \
                    --output="plot-artifacts/${relative%model.json}composite.png"
                  if jq -e '
                    .composite_config
                    | if type == "array" then . else .strategies end
                    | any(.linear.calibrate? | type == "array")
                  ' "${source}" > /dev/null; then
                    uv --project base/utils/measure run --group visualize powercalc-visualize \
                      "${source}" \
                      --output="plot-artifacts/${relative%model.json}calibration.png"
                  fi
                  continue
                fi
                output="plot-artifacts/${relative%model.json}calibration.png"
              else
                output="plot-artifacts/${relative%.csv.gz}.png"
              fi
              uv --project base/utils/measure run --group visualize powercalc-visualize \
                "${source}" --output="${output}"
            else
              echo "::error::Changed file is missing from checkout: ${file}"
              exit 1
            fi
          done <<< "${STEPS_LIST_FILES_OUTPUTS_CHANGEDFILES}"
        env:
          STEPS_LIST_FILES_OUTPUTS_CHANGEDFILES: ${{ steps.list-files.outputs.changedFiles }}
      - name: Verify plots generated
        if: steps.list-files.outputs.hasPlots == 'true'
        run: |
          if ! find plot-artifacts -type f -name '*.png' -print -quit | grep -q .; then
            echo "::error::No plot PNG files were generated"
            exit 1
          fi
      - name: Write PR number
        if: steps.list-files.outputs.hasPlots == 'true'
        run: |
          echo "${{ github.event.pull_request.number }}" > plot-artifacts/pr_number.txt
      - name: Upload Artifact
        if: steps.list-files.outputs.hasPlots == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plots
          if-no-files-found: error
          path: plot-artifacts
