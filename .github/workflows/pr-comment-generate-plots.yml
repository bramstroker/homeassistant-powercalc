name: Generate PR plots

on:
  pull_request:
    paths:
      - 'profile_library/**/*.csv'
      - 'profile_library/**/*.csv.gz'
      - 'profile_library/**/model.json'

concurrency:
  # Supersede in-flight runs for the same pull request; every other event gets a
  # unique group so pushes, schedules and dispatches never cancel or queue each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-plots:
    name: Generate plots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted visualization code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout PR files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          working-directory: './base/utils/measure'
          enable-cache: true
          cache-dependency-glob: |
            base/utils/measure/pyproject.toml
            base/utils/measure/uv.lock
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        name: List changed files from the PR
        with:
          script: |
            const fs = require('fs')
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            })
            fs.writeFileSync('changed-files.json', JSON.stringify(changed.map((entry) => entry.filename)))
      - name: Run visualization tool
        id: generate-plots
        env:
          PYTHONPATH: base/utils/measure
        run: |
          mkdir -p plot-artifacts
          uv sync --project base/utils/measure --locked --group visualize --no-build --no-install-project
          uv --project base/utils/measure run --locked --no-sync --no-build python -m measure.visualization.pr_plots \
            --checkout-root pr \
            --changed-files changed-files.json \
            --output-directory plot-artifacts
          if find plot-artifacts -type f -name '*.png' -print -quit | grep -q .; then
            echo "hasPlots=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasPlots=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write PR number
        if: steps.generate-plots.outputs.hasPlots == 'true'
        run: |
          echo "${{ github.event.pull_request.number }}" > plot-artifacts/pr_number.txt
      - name: Upload Artifact
        if: steps.generate-plots.outputs.hasPlots == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plots
          if-no-files-found: error
          path: plot-artifacts
