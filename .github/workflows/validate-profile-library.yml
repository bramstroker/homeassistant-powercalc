name: Validate profile library

# The pull request validation only sees the files a PR touched. This one holds the whole library
# to the schemas, so a rule tightened today is enforced on every profile written before it.

on:
  push:
    branches:
      - master
    paths:
      - 'profile_library/**'
      - 'utils/library/validate_model_json.py'
      - '.github/workflows/validate-profile-library.yml'
  pull_request:
    paths:
      - 'profile_library/model_schema.json'
      - 'profile_library/manufacturer_schema.json'
      - 'utils/library/validate_model_json.py'
      - '.github/workflows/validate-profile-library.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate_profile_library:
    name: Validate whole profile library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.8'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Validate every model.json and manufacturer.json against its schema
        run: >-
          uv run --locked --only-group library --no-build
          python -m utils.library.validate_model_json
      - name: Restore product URL failure state
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p product-url-state
          previous_run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=product-url-failure-state&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if test -n "${previous_run_id}"; then
            gh run download "${previous_run_id}" --name product-url-failure-state --dir product-url-state
          fi
      - name: Validate product URLs
        if: github.event_name == 'schedule'
        run: >-
          uv run --locked --only-group library --no-build
          python -m utils.library.validate_product_urls
          --failure-state product-url-state/failures.json
          --failure-state-output product-url-state/failures.json
          --failure-threshold 3
          --report "${GITHUB_STEP_SUMMARY}"
      - name: Save product URL failure state
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-url-failure-state
          path: product-url-state/failures.json
          if-no-files-found: ignore
          retention-days: 90
