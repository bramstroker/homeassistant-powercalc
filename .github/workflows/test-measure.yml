name: Test measure util

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'utils/measure/**'
      - '.github/actions/build-measure-docker/**'
      - '.github/workflows/test-measure.yml'
  pull_request:
    paths:
      - 'utils/measure/**'
      - '.github/actions/build-measure-docker/**'
      - '.github/workflows/test-measure.yml'

concurrency:
  # Supersede in-flight runs for the same pull request; every other event gets a
  # unique group so pushes, schedules and dispatches never cancel or queue each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    name: Run tests
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          working-directory: './utils/measure'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Run tests
        run: |
          cd ./utils/measure
          uv run --locked --extra dev --extra app --extra cli ruff check measure tests prepare_app_release.py
          MYPYPATH=. uv run --locked --extra dev --extra app --extra cli mypy \
            --strict \
            --explicit-package-bases \
            --follow-imports=silent \
            --ignore-missing-imports \
            --config-file ../../pyproject.toml \
            prepare_app_release.py \
            measure
          uv run --locked --extra dev --extra app --extra cli pytest \
            -qq \
            --durations=10 \
            -o console_output_style=count \
            -p no:sugar \
            tests
          uv run --locked --extra dev --group visualize pytest -q tests/test_visualization_renderer.py

  frontend-lint:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    name: Lint frontend
    defaults:
      run:
        working-directory: ./utils/measure/frontend
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: utils/measure/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run ESLint
        run: npm run lint

  frontend-e2e:
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    name: Run frontend browser tests
    defaults:
      run:
        working-directory: ./utils/measure/frontend
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: utils/measure/frontend/package-lock.json
        # The Playwright postinstall hook is skipped here; browsers are installed
        # explicitly below so they can be cached separately from node_modules.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore browser cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
        # The locally installed binary is used rather than `npx`, which would fetch and run
        # whatever version it resolves when the package is missing.
      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium
        # A cached browser still needs its system libraries on a fresh runner.
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            utils/measure/frontend/playwright-report/
            utils/measure/frontend/test-results/
          retention-days: 7

  docker:
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    name: Build Docker image
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Docker image
        uses: ./.github/actions/build-measure-docker

  home-assistant-app:
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    name: Validate Home Assistant app
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate repository and app metadata
        run: ruby utils/measure/home-assistant-app/validate.rb
      - name: Run Home Assistant app linter
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: ./utils/measure/home-assistant-app/powercalc_measure
      - name: Build Home Assistant app image
        uses: ./.github/actions/build-measure-docker
        with:
          target: ha-app
