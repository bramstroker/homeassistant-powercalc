name: Update profile library

on:
  pull_request:
    types:
      - closed
    branches:
      - master
    paths:
      - '.github/scripts/profile_library/**'
  push:
    paths:
      - '**/model.json'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    name: Update profile library
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.33'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Pull again
        run: git pull || true
      - name: Update library.json, authors and translations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run --locked --only-group profile-library --no-build
          python .github/scripts/profile_library/update_library.py
      - uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10
        if: github.ref == 'refs/heads/master'
        with:
          add: 'profile_library'
          message: 'Update profile library'
          push: 'origin HEAD:master --force'
      - name: Wait 5 seconds
        run: sleep 5
      - name: Purge cloudflare cache
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{
          	"files": [
          		"https://api.powercalc.nl/library"
          	]
          }'
