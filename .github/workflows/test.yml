name: Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/ha_version_matrix.py'
      - '.github/scripts/profile_library/**'
      - '.github/scripts/release_draft/**'
      - '.github/workflows/test.yml'
      - 'custom_components/powercalc/**'
      - 'pyproject.toml'
      - 'tests/**'
      - 'utils/library/**'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/scripts/ha_version_matrix.py'
      - '.github/scripts/profile_library/**'
      - '.github/scripts/release_draft/**'
      - '.github/workflows/test.yml'
      - 'custom_components/powercalc/**'
      - 'pyproject.toml'
      - 'tests/**'
      - 'utils/library/**'
      - 'uv.lock'

concurrency:
  # Supersede in-flight runs for the same pull request; every other event gets a
  # unique group so pushes, schedules and dispatches never cancel or queue each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    name: Run tests
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --locked --group dev --group library
      - name: Prepare test env
        run: bash tests/setup.sh
      - name: Run release draft engine tests
        run: uv run --locked pytest .github/scripts/release_draft/tests -qq
      - name: Run profile library script tests
        run: uv run --locked pytest .github/scripts/profile_library/tests -qq
      - name: Run tests
        run: |
          uv run --locked pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            --cov custom_components.powercalc \
            --cov-report xml \
            -o console_output_style=count \
            -p no:sugar
          uv run --locked coverage lcov
      - name: Upload Coverage Results
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov

  ha-versions:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    name: Determine supported HA versions
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Build version matrix
        id: matrix
        run: python3 .github/scripts/ha_version_matrix.py >> "$GITHUB_OUTPUT"

  tests-ha-compat:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    needs: ha-versions
    if: needs.ha-versions.outputs.versions != '[]'
    name: Run tests (HA ${{ matrix.target.ha_version }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.ha-versions.outputs.versions) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          # Test every release on the oldest Python it supports, so a future Python
          # release does not get handed to a Home Assistant that predates it.
          python-version: ${{ matrix.target.python_version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Pin Home Assistant version
        env:
          HA_VERSION: ${{ matrix.target.ha_version }}
        # pytest-homeassistant-custom-component pins an exact homeassistant version,
        # so resolving it against the requested release picks the matching plugin.
        # --no-config skips the override-dependencies from pyproject.toml, which are
        # pinned against the locked release and conflict with older ones. --python is
        # required because UV_PYTHON, set by setup-uv, otherwise wins over .venv here.
        # The floors keep a release without a matching plugin an outright resolution
        # error: without them the resolver walks back to a plugin old enough to pin no
        # homeassistant at all, and silently swaps in a pytest that predates our Python.
        run: |
          uv pip install --no-config --python .venv \
            "homeassistant==${HA_VERSION}" \
            "pytest-homeassistant-custom-component>=0.13" \
            "pytest>=9"
      - name: Prepare test env
        run: bash tests/setup.sh
      - name: Run tests
        run: |
          uv run --no-sync --no-build pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -o console_output_style=count \
            -p no:sugar \
            tests
